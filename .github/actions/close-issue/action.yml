name: Close issue
description: >-
  Close an issue with an explicit state reason. Closed does not mean finished in
  this repo - submissions are closed to park them - so the reason is always set
  deliberately rather than left to GitHub's default.

inputs:
  issue_number:
    description: Issue number to close.
    required: true
  state_reason:
    description: 'Why the issue is being closed: not_planned or completed.'
    required: false
    default: not_planned
  duplicate_of:
    description: >-
      URL of the issue this one duplicates. Closes it against that issue
      instead, which supersedes state_reason.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Close issue
      if: inputs.duplicate_of == ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          await github.rest.issues.update({
            ...context.repo,
            issue_number: parseInt(process.env.ISSUE_NUMBER),
            state: 'closed',
            state_reason: process.env.STATE_REASON
          });

          core.info(`Closed issue #${process.env.ISSUE_NUMBER} as "${process.env.STATE_REASON}".`);
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        STATE_REASON: ${{ inputs.state_reason }}

    - name: Close issue as a duplicate
      if: inputs.duplicate_of != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { repository, resource } = await github.graphql(`
            query($owner: String!, $repo: String!, $number: Int!, $url: URI!) {
              repository(owner: $owner, name: $repo) { issue(number: $number) { id } }
              resource(url: $url) { ... on Issue { id } }
            }`, { ...context.repo,
                  number: parseInt(process.env.ISSUE_NUMBER),
                  url: process.env.DUPLICATE_OF });

          await github.graphql(`
            mutation($issueId: ID!, $duplicateIssueId: ID) {
              closeIssue(input: {
                issueId: $issueId,
                stateReason: DUPLICATE,
                duplicateIssueId: $duplicateIssueId
              }) { issue { number } }
            }`, { issueId: repository.issue.id,
                  duplicateIssueId: resource?.id ?? null });

          core.info(`Closed issue #${process.env.ISSUE_NUMBER} as a duplicate of ${process.env.DUPLICATE_OF}.`);
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        DUPLICATE_OF: ${{ inputs.duplicate_of }}
