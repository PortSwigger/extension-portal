name: Process issue comment commands

# Routes slash commands posted as issue comments:
#   /reopen   - reopens a closed issue (restoring archived ones via the team).
#   /resubmit - re-runs the automated submission pipeline after a repo-specific
#               rejection, unless a submission already succeeded.

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reopen-issue:
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'closed' &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zoom_payload: ${{ steps.prepare_payload.outputs.payload }}

    steps:
      - name: Checkout scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private-key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}

      - name: Reopen the issue and restore it to the board
        id: reopen
        run: python3 .github/scripts/reopen_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_OWNER: ${{ github.repository_owner }}

      - name: Confirm the reopen
        uses: ./.github/actions/post-issue-comment
        with:
          issue_number: ${{ github.event.issue.number }}
          template_key: reopen-issue.reopened

      - name: Prepare Zoom notification payload
        id: prepare_payload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const boardWarning = process.env.BOARD_WARNING;

            const payload = {
              "Alert": "Issue reopened",
              "Issue": `#${context.issue.number}: ${context.payload.issue.title}`,
              "Reopened by": context.payload.comment.user.login,
              "URL": context.payload.issue.html_url,
              // The submitter is told the reopen worked, because it did. A card
              // left off the board is only ever seen if it is reported here.
              ...(boardWarning ? { "Board": `⚠️ ${boardWarning}` } : {})
            };

            // Base64 encode to prevent GitHub from masking the output
            const encodedPayload = Buffer.from(JSON.stringify(payload)).toString('base64');
            core.setOutput('payload', encodedPayload);
        env:
          BOARD_WARNING: ${{ steps.reopen.outputs.board_warning }}

  resubmit-issue:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/resubmit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}

    steps:
      - name: Checkout scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Decide whether to resubmit
        id: decide
        run: python3 .github/scripts/check_resubmit_eligibility.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_TYPE_NAME: ${{ github.event.issue.type.name }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

      - name: Explain why the resubmission was rejected
        if: |
          steps.decide.outputs.proceed == 'false' &&
          steps.decide.outputs.template_key != ''
        uses: ./.github/actions/post-issue-comment
        with:
          issue_number: ${{ github.event.issue.number }}
          template_key: ${{ steps.decide.outputs.template_key }}

  resubmit-reopen:
    needs: resubmit-issue
    if: needs.resubmit-issue.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    outputs:
      zoom_payload: ${{ steps.prepare_payload.outputs.payload }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private-key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}

      - name: Reopen the issue and return it to concept review
        id: reopen
        run: python3 .github/scripts/reopen_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          TARGET_COLUMN: Concept review

      - name: Prepare Zoom notification payload
        id: prepare_payload
        if: steps.reopen.outputs.board_warning != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const payload = {
              "Alert": "Resubmitted issue is not on the review board",
              "Issue": `#${context.issue.number}: ${context.payload.issue.title}`,
              "Board": `⚠️ ${process.env.BOARD_WARNING}`,
              "Action": "Put the card in Concept review by hand.",
              "URL": context.payload.issue.html_url
            };

            // Base64 encode to prevent GitHub from masking the output
            const encodedPayload = Buffer.from(JSON.stringify(payload)).toString('base64');
            core.setOutput('payload', encodedPayload);
        env:
          BOARD_WARNING: ${{ steps.reopen.outputs.board_warning }}

  resubmit-process:
    needs: [resubmit-issue, resubmit-reopen]
    if: needs.resubmit-issue.outputs.proceed == 'true'
    uses: ./.github/workflows/process-created-issue.yml
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      PROJECT_ACCESS_APP_ID: ${{ secrets.PROJECT_ACCESS_APP_ID }}
      PROJECT_ACCESS_PRIVATE_KEY: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}
      ZOOM_WEBHOOK_URL: ${{ secrets.ZOOM_WEBHOOK_URL }}
      ZOOM_VERIFICATION_TOKEN: ${{ secrets.ZOOM_VERIFICATION_TOKEN }}

  notify-zoom:
    needs: [reopen-issue, resubmit-reopen]
    if: |
      !cancelled() &&
      (needs.reopen-issue.outputs.zoom_payload != '' ||
       needs.resubmit-reopen.outputs.zoom_payload != '')
    uses: ./.github/workflows/common-notify-zoom.yml
    with:
      payload: ${{ needs.reopen-issue.outputs.zoom_payload || needs.resubmit-reopen.outputs.zoom_payload }}
    secrets:
      ZOOM_WEBHOOK_URL: ${{ secrets.ZOOM_WEBHOOK_URL }}
      ZOOM_VERIFICATION_TOKEN: ${{ secrets.ZOOM_VERIFICATION_TOKEN }}
