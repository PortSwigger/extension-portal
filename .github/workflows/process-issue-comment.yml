name: Process issue comment commands

# Routes slash commands posted as issue comments:
#   /reopen   - reopens a closed issue (restoring archived ones via the team).
#   /resubmit - re-runs the automated submission pipeline after a repo-specific
#               rejection, unless a submission already succeeded.
#
# Neither applies to an issue closed as a duplicate: the submission it duplicates
# is the one to follow, and reopening this one would put a second copy of the
# same extension back on the review board.

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  refuse-duplicate:
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state_reason == 'duplicate' &&
      (startsWith(github.event.comment.body, '/reopen') ||
       startsWith(github.event.comment.body, '/resubmit'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Explain that a duplicate is not reopened
        uses: ./.github/actions/post-issue-comment
        with:
          issue_number: ${{ github.event.issue.number }}
          template_key: duplicate-issue.not-reopened

  reopen-issue:
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'closed' &&
      github.event.issue.state_reason != 'duplicate' &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      notification: ${{ steps.prepare_notification.outputs.notification }}
      jira_notification: ${{ steps.sync.outputs.notification }}

    steps:
      - name: Checkout scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private-key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}

      - name: Reopen the issue and restore it to the board
        id: reopen
        run: python3 .github/scripts/reopen_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_OWNER: ${{ github.repository_owner }}

      - name: Confirm the reopen
        uses: ./.github/actions/post-issue-comment
        with:
          issue_number: ${{ github.event.issue.number }}
          template_key: reopen-issue.reopened

      - name: Return the associated ticket to the review queue
        id: sync
        continue-on-error: true
        if: '!cancelled() && steps.reopen.outcome == ''success'''
        run: python3 .github/scripts/sync_jira_status.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TYPE_NAME: ${{ github.event.issue.type.name }}
          ISSUE_ACTION: reopened
          ACTOR_LOGIN: ${{ github.event.comment.user.login }}

      - name: Prepare the notification
        id: prepare_notification
        continue-on-error: true
        run: python3 .github/scripts/report_reopen.py
        env:
          COMMAND: reopen
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TYPE_NAME: ${{ github.event.issue.type.name }}
          JIRA_KEY: ${{ steps.sync.outputs.jira_key }}
          ACTOR_LOGIN: ${{ github.event.comment.user.login }}
          BOARD_WARNING: ${{ steps.reopen.outputs.board_warning }}

  resubmit-issue:
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state_reason != 'duplicate' &&
      startsWith(github.event.comment.body, '/resubmit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}

    steps:
      - name: Checkout scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Decide whether to resubmit
        id: decide
        run: python3 .github/scripts/check_resubmit_eligibility.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_TYPE_NAME: ${{ github.event.issue.type.name }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

      - name: Explain why the resubmission was rejected
        if: |
          steps.decide.outputs.proceed == 'false' &&
          steps.decide.outputs.template_key != ''
        uses: ./.github/actions/post-issue-comment
        with:
          issue_number: ${{ github.event.issue.number }}
          template_key: ${{ steps.decide.outputs.template_key }}

  resubmit-reopen:
    needs: resubmit-issue
    if: needs.resubmit-issue.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    outputs:
      notification: ${{ steps.prepare_notification.outputs.notification }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private-key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}

      - name: Reopen the issue and return it to concept review
        id: reopen
        run: python3 .github/scripts/reopen_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          TARGET_COLUMN: Concept review

      - name: Prepare the notification
        id: prepare_notification
        continue-on-error: true
        run: python3 .github/scripts/report_reopen.py
        env:
          COMMAND: resubmit
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TYPE_NAME: ${{ github.event.issue.type.name }}
          BOARD_WARNING: ${{ steps.reopen.outputs.board_warning }}

  resubmit-process:
    needs: [resubmit-issue, resubmit-reopen]
    if: needs.resubmit-issue.outputs.proceed == 'true'
    uses: ./.github/workflows/process-created-issue.yml
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      PROJECT_ACCESS_APP_ID: ${{ secrets.PROJECT_ACCESS_APP_ID }}
      PROJECT_ACCESS_PRIVATE_KEY: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

  notify-webhook:
    needs: [reopen-issue, resubmit-reopen]
    if: |
      !cancelled() &&
      (needs.reopen-issue.outputs.notification != '' ||
       needs.resubmit-reopen.outputs.notification != '')
    uses: ./.github/workflows/common-notify-webhook.yml
    with:
      payload: ${{ needs.reopen-issue.outputs.notification || needs.resubmit-reopen.outputs.notification }}
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}

  notify-webhook-jira:
    needs: reopen-issue
    if: |
      !cancelled() &&
      needs.reopen-issue.outputs.jira_notification != ''
    uses: ./.github/workflows/common-notify-webhook.yml
    with:
      payload: ${{ needs.reopen-issue.outputs.jira_notification }}
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
