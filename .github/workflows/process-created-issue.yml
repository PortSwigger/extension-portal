name: Process created issue

on:
  issues:
    types: [opened]
  workflow_call:

permissions:
  issues: write
  contents: read

concurrency:
  group: portal-issue-${{ github.event.issue.user.login }}
  cancel-in-progress: false

jobs:
  extract-issue-details:
    if: |
      github.event.issue.type.name == 'Extension' ||
      github.event.issue.type.name == 'Update'
    uses: ./.github/workflows/common-extract-issue-details.yml

  validate-submission:
    needs: extract-issue-details
    if: |
      !cancelled() &&
      (needs.extract-issue-details.outputs.type == 'extension-submission' ||
       needs.extract-issue-details.outputs.type == 'extension-update') &&
      needs.extract-issue-details.outputs.error_message == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      error_message: ${{ steps.summarise.outputs.error_message }}
      normalized_url: ${{ steps.summarise.outputs.normalized_url }}
      source_repo_url: ${{ steps.summarise.outputs.source_repo_url }}

    steps:
      - name: Harden runner
        uses: portswigger-tim/safer-runner-action@b2208f653b6bf422e08501155f4df82bad008184 # v1.2.2
        with:
          mode: enforce
          disable-sudo: 'true'
          disable-docker: 'true'
          block-risky-github-subdomains: 'true'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository exists and is not a fork
        id: validate_repo
        if: needs.extract-issue-details.outputs.type == 'extension-submission'
        run: |
          python3 .github/scripts/validate_repo.py
        env:
          URL: ${{ needs.extract-issue-details.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source repository
        id: resolve_source
        if: needs.extract-issue-details.outputs.type == 'extension-update'
        run: |
          python3 .github/scripts/resolve_source_repo.py
        env:
          URL: ${{ needs.extract-issue-details.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify extension language
        id: extension_language
        if: steps.validate_repo.outcome == 'success'
        run: |
          python3 .github/scripts/detect_language.py
        env:
          URL: ${{ needs.extract-issue-details.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout extension repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.extension_language.outputs.language == 'Java'
        with:
          repository: '${{ steps.validate_repo.outputs.owner }}/${{ steps.validate_repo.outputs.repo }}'
          path: 'extension-repo'

      - name: Determine build platform
        id: build_platform
        if: steps.extension_language.outputs.language == 'Java'
        working-directory: extension-repo
        run: |
          if [[ -f "pom.xml" ]]; then
            echo "build_system=Maven" >> $GITHUB_OUTPUT
          elif [[ -f "build.gradle" || -f "build.gradle.kts" ]]; then
            if [[ ! -f "gradlew" ]]; then
              echo "error_message=Gradle wrapper (gradlew) not found. Please include gradlew in your repository." >> $GITHUB_OUTPUT
              echo "ERROR: Gradle wrapper (gradlew) not found"
              exit 1
            fi
            echo "build_system=Gradle" >> $GITHUB_OUTPUT
          else
            echo "error_message=No build system found. Please ensure your repository contains pom.xml (Maven) or build.gradle (Gradle). If using Gradle, please ensure to include the wrapper." >> $GITHUB_OUTPUT
            echo "ERROR: Unable to detect Java build system (no pom.xml or build.gradle found)"
            echo "Please ensure your project uses Maven or Gradle"
            exit 1
          fi

      - name: Summarise validation result
        id: summarise
        if: '!cancelled()'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validateOutcome = process.env.VALIDATE_OUTCOME;
            const validateError = process.env.VALIDATE_ERROR;
            const languageOutcome = process.env.LANGUAGE_OUTCOME;
            const languageError = process.env.LANGUAGE_ERROR;
            const buildOutcome = process.env.BUILD_OUTCOME;
            const buildError = process.env.BUILD_ERROR;
            const resolveOutcome = process.env.RESOLVE_OUTCOME;
            const resolveError = process.env.RESOLVE_ERROR;

            let message = '';
            if (validateOutcome === 'failure') {
              message = validateError || 'Repository validation failed. The repository may be a fork or not accessible.';
            } else if (languageOutcome === 'failure') {
              message = languageError || 'No supported source code (Java, Kotlin, Python, or Ruby) was found in the repository. Your repository must contain the source code of your extension.';
            } else if (buildOutcome === 'failure') {
              message = buildError || 'Build system validation failed. Please ensure your repository contains a valid Maven or Gradle build configuration.';
            } else if (resolveOutcome === 'failure') {
              message = resolveError || 'Could not resolve the source repository from the pull request URL.';
            }

            core.setOutput('error_message', message);
            // Submissions normalize the extension repository URL; updates resolve the source
            // repository (the fork's parent, or the repository itself if PortSwigger-owned)
            // used to find the parent ticket.
            core.setOutput('normalized_url', process.env.VALIDATE_URL || '');
            core.setOutput('source_repo_url', process.env.RESOLVE_URL || '');
        env:
          VALIDATE_OUTCOME: ${{ steps.validate_repo.outcome }}
          VALIDATE_ERROR: ${{ steps.validate_repo.outputs.error_message }}
          LANGUAGE_OUTCOME: ${{ steps.extension_language.outcome }}
          LANGUAGE_ERROR: ${{ steps.extension_language.outputs.error_message }}
          BUILD_OUTCOME: ${{ steps.build_platform.outcome }}
          BUILD_ERROR: ${{ steps.build_platform.outputs.error_message }}
          RESOLVE_OUTCOME: ${{ steps.resolve_source.outcome }}
          RESOLVE_ERROR: ${{ steps.resolve_source.outputs.error_message }}
          VALIDATE_URL: ${{ steps.validate_repo.outputs.normalized_url }}
          RESOLVE_URL: ${{ steps.resolve_source.outputs.normalized_url }}

  submit-extension:
    needs: [extract-issue-details, validate-submission]
    if: |
      !cancelled() &&
      needs.extract-issue-details.outputs.type == 'extension-submission'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      zoom_payload: ${{ steps.prepare_zoom.outputs.payload }}
      template_key: ${{ steps.prepare_comment.outputs.template_key }}
      error_message: ${{ steps.prepare_comment.outputs.error_message }}
      should_close: ${{ steps.prepare_comment.outputs.should_close }}
      has_comment: ${{ steps.prepare_comment.outputs.has_comment }}

    steps:
      - name: Apply product compatibility labels
        if: needs.extract-issue-details.outputs.product_compatibility != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const compatibilityData = process.env.PRODUCT_COMPATIBILITY || '[]';
              const labels = JSON.parse(compatibilityData);

              if (Array.isArray(labels) && labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels
                });
                core.info(`Applied product compatibility labels: ${labels.join(', ')}`);
              } else {
                core.info('No additional product compatibility labels selected');
              }
            } catch (error) {
              core.warning(`Failed to apply product compatibility labels: ${error.message}`);
            }
        env:
          PRODUCT_COMPATIBILITY: ${{ needs.extract-issue-details.outputs.product_compatibility }}

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Create Jira ticket
        id: create_jira
        if: |
          needs.extract-issue-details.outputs.error_message == '' &&
          needs.validate-submission.outputs.error_message == ''
        run: python3 .github/scripts/create_submission_ticket.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TITLE: ${{ needs.extract-issue-details.outputs.title }}
          REPO_URL: ${{ needs.validate-submission.outputs.normalized_url }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

      - name: Convert product compatibility format
        id: convert_products
        if: steps.create_jira.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const compatibilityData = process.env.PRODUCT_COMPATIBILITY || '[]';
            const labels = JSON.parse(compatibilityData);

            // Map display names to lowercase format expected by review workflow
            const mapping = {
              'Community': 'community',
              'DAST': 'dast',
              'Burp AI': 'burpai'
            };

            const convertedProducts = labels
              .map(label => mapping[label])
              .filter(Boolean)
              .join(',');

            core.setOutput('products', convertedProducts);
            core.info(`Converted products: ${convertedProducts}`);
        env:
          PRODUCT_COMPATIBILITY: ${{ needs.extract-issue-details.outputs.product_compatibility }}

      - name: Checkout repository
        if: steps.convert_products.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trigger review workflow
        id: review_workflow
        if: steps.convert_products.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/trigger-review
        with:
          app_id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private_key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}
          extension_name: ${{ needs.extract-issue-details.outputs.title }}
          target_repo_url: ${{ needs.validate-submission.outputs.normalized_url }}
          compatible_products: ${{ steps.convert_products.outputs.products }}
          jira_ticket: ${{ steps.create_jira.outputs.jira_key }}
          issue_url: ${{ github.event.issue.html_url }}
          is_update: 'false'

      - name: Prepare comment data
        id: prepare_comment
        if: '!cancelled()'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const extractError = process.env.EXTRACT_ERROR || '';
            const validateError = process.env.VALIDATE_ERROR || '';
            const createJiraOutcome = process.env.CREATE_JIRA_OUTCOME || 'skipped';

            const jobSuccess = !extractError && !validateError && createJiraOutcome === 'success';

            let templateKey;
            let errorMessage = '';
            let shouldClose = false;

            if (jobSuccess) {
              templateKey = 'extension-submission.success';
            } else {
              const specificError = extractError || validateError || (createJiraOutcome === 'failure'
                ? 'Failed to create ticket. Please contact [bapps@portswigger.net](mailto:bapps@portswigger.net) for assistance.'
                : '');
              templateKey = specificError
                ? 'extension-submission.failure-specific'
                : 'extension-submission.failure-generic';
              errorMessage = specificError;
              shouldClose = true;
            }

            core.setOutput('template_key', templateKey);
            core.setOutput('error_message', errorMessage);
            core.setOutput('should_close', shouldClose.toString());
            core.setOutput('has_comment', 'true');
        env:
          EXTRACT_ERROR: ${{ needs.extract-issue-details.outputs.error_message }}
          VALIDATE_ERROR: ${{ needs.validate-submission.outputs.error_message }}
          CREATE_JIRA_OUTCOME: ${{ steps.create_jira.outcome }}

      - name: Prepare Zoom notification payload
        id: prepare_zoom
        if: needs.extract-issue-details.outputs.error_message == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = process.env.TITLE;
            const jiraKey = process.env.JIRA_KEY;
            const validateError = process.env.VALIDATE_ERROR;
            const issueUrl = context.payload.issue.html_url;

            const payload = {
              "Extension": title,
              "Issue": issueUrl,
              ...(validateError
                ? { "Validation Error": `❌ ${validateError}` }
                : { "Jira Ticket": jiraKey || '❌ Not created' })
            };

            // Base64 encode to prevent GitHub from masking the output
            const encodedPayload = Buffer.from(JSON.stringify(payload)).toString('base64');
            core.setOutput('payload', encodedPayload);
        env:
          TITLE: ${{ needs.extract-issue-details.outputs.title }}
          JIRA_KEY: ${{ steps.create_jira.outputs.jira_key }}
          VALIDATE_ERROR: ${{ needs.validate-submission.outputs.error_message }}

  submit-update:
    needs: [extract-issue-details, validate-submission]
    if: |
      !cancelled() &&
      needs.extract-issue-details.outputs.type == 'extension-update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      zoom_payload: ${{ steps.prepare_zoom.outputs.payload }}
      template_key: ${{ steps.prepare_comment.outputs.template_key }}
      error_message: ${{ steps.prepare_comment.outputs.error_message }}
      should_close: ${{ steps.prepare_comment.outputs.should_close }}
      has_comment: ${{ steps.prepare_comment.outputs.has_comment }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Create Jira ticket
        id: create_jira
        if: |
          needs.extract-issue-details.outputs.error_message == '' &&
          needs.validate-submission.outputs.error_message == ''
        run: python3 .github/scripts/create_update_ticket.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SOURCE_URL: ${{ needs.validate-submission.outputs.source_repo_url }}
          PR_URL: ${{ needs.extract-issue-details.outputs.url }}
          VERSION_NUMBER: ${{ needs.extract-issue-details.outputs.version_number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

      - name: Checkout repository
        if: steps.create_jira.outputs.status == 'automated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trigger review workflow
        id: review_workflow
        if: steps.create_jira.outputs.status == 'automated'
        continue-on-error: true
        uses: ./.github/actions/trigger-review
        with:
          app_id: ${{ secrets.PROJECT_ACCESS_APP_ID }}
          private_key: ${{ secrets.PROJECT_ACCESS_PRIVATE_KEY }}
          extension_name: ${{ needs.extract-issue-details.outputs.title }}
          target_repo_url: ${{ needs.extract-issue-details.outputs.url }}
          jira_ticket: ${{ steps.create_jira.outputs.jira_key }}
          issue_url: ${{ github.event.issue.html_url }}
          is_update: 'true'

      - name: Prepare Zoom notification payload
        id: prepare_zoom
        if: needs.extract-issue-details.outputs.error_message == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = process.env.TITLE;
            const prUrl = process.env.URL;
            const versionNumber = process.env.VERSION_NUMBER;
            const issueUrl = context.payload.issue.html_url;
            const validateError = process.env.VALIDATE_ERROR;
            const status = process.env.UPDATE_STATUS;
            const jiraKey = process.env.JIRA_KEY;
            const reason = process.env.UPDATE_REASON;
            const reviewOutcome = process.env.REVIEW_OUTCOME;

            const payload = {
              "Extension": title,
              "Version": versionNumber,
              "PR": prUrl,
              "Issue": issueUrl
            };

            if (validateError) {
              // Repository link validation failed - the submission is rejected.
              payload["Validation Error"] = `❌ ${validateError}`;
            } else if (status === 'automated') {
              // Subtask created and review kicked off automatically.
              payload["Update Ticket"] = jiraKey;
              payload["Review"] = reviewOutcome === 'success' ? '✅ Triggered' : '⚠️ Not triggered - investigate';
            } else {
              // No single parent ticket matched - fall back to manual intervention.
              payload["Action"] = "⚠️ Create associated update ticket.";
              if (reason) {
                payload["Reason"] = reason;
              }
            }

            // Base64 encode to prevent GitHub from masking the output
            const encodedPayload = Buffer.from(JSON.stringify(payload)).toString('base64');
            core.setOutput('payload', encodedPayload);
        env:
          URL: ${{ needs.extract-issue-details.outputs.url }}
          VERSION_NUMBER: ${{ needs.extract-issue-details.outputs.version_number }}
          TITLE: ${{ needs.extract-issue-details.outputs.title }}
          VALIDATE_ERROR: ${{ needs.validate-submission.outputs.error_message }}
          UPDATE_STATUS: ${{ steps.create_jira.outputs.status }}
          JIRA_KEY: ${{ steps.create_jira.outputs.jira_key }}
          UPDATE_REASON: ${{ steps.create_jira.outputs.reason }}
          REVIEW_OUTCOME: ${{ steps.review_workflow.outcome }}

      - name: Prepare comment data
        id: prepare_comment
        if: '!cancelled()'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const extractError = process.env.EXTRACT_ERROR || '';
            const validateError = process.env.VALIDATE_ERROR || '';
            const status = process.env.UPDATE_STATUS || '';

            // A matched-or-manual update is a success for the submitter; only a bad
            // submission (extraction or repository link validation) is rejected.
            const jobSuccess = !extractError && !validateError;

            let templateKey;
            let errorMessage = '';
            let shouldClose = false;

            if (jobSuccess) {
              templateKey = status === 'automated'
                ? 'update-submission.success'
                : 'update-submission.manual';
            } else {
              const specificError = extractError || validateError;
              templateKey = specificError
                ? 'update-submission.failure-specific'
                : 'update-submission.failure-generic';
              errorMessage = specificError || '';
              shouldClose = true;
            }

            core.info(`Template key: ${templateKey}`);
            core.info(`Error message: ${errorMessage}`);
            core.info(`Should close: ${shouldClose}`);

            core.setOutput('template_key', templateKey);
            core.setOutput('error_message', errorMessage);
            core.setOutput('should_close', shouldClose.toString());
            core.setOutput('has_comment', 'true');
        env:
          EXTRACT_ERROR: ${{ needs.extract-issue-details.outputs.error_message }}
          VALIDATE_ERROR: ${{ needs.validate-submission.outputs.error_message }}
          UPDATE_STATUS: ${{ steps.create_jira.outputs.status }}

  post-comment:
    needs: [extract-issue-details, submit-extension, submit-update]
    if: |
      !cancelled() &&
      (needs.submit-extension.outputs.has_comment == 'true' ||
       needs.submit-update.outputs.has_comment == 'true')
    uses: ./.github/workflows/common-post-issue-comment.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      template_key: ${{ needs.submit-extension.outputs.template_key || needs.submit-update.outputs.template_key }}
      error_message: ${{ needs.submit-extension.outputs.error_message || needs.submit-update.outputs.error_message }}

  close-issue:
    needs: [extract-issue-details, submit-extension, submit-update, post-comment]
    if: |
      !cancelled() &&
      needs.post-comment.result == 'success' &&
      (needs.submit-extension.outputs.should_close == 'true' ||
       needs.submit-update.outputs.should_close == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });

  notify-zoom:
    needs: [extract-issue-details, submit-extension, submit-update]
    if: |
      !cancelled() &&
      (needs.submit-extension.outputs.zoom_payload != '' ||
       needs.submit-update.outputs.zoom_payload != '')
    uses: ./.github/workflows/common-notify-zoom.yml
    with:
      payload: ${{ needs.submit-extension.outputs.zoom_payload || needs.submit-update.outputs.zoom_payload }}
    secrets:
      ZOOM_WEBHOOK_URL: ${{ secrets.ZOOM_WEBHOOK_URL }}
      ZOOM_VERIFICATION_TOKEN: ${{ secrets.ZOOM_VERIFICATION_TOKEN }}
