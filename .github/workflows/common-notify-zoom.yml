name: Notify Zoom

on:
  workflow_call:
    inputs:
      payload:
        description: 'Base64-encoded JSON payload to send to Zoom webhook'
        required: true
        type: string
    secrets:
      ZOOM_WEBHOOK_URL:
        required: true
      ZOOM_VERIFICATION_TOKEN:
        required: true

permissions:
  contents: read

# This stays a separate job rather than becoming a composite action so that the
# third-party HTTP action is the only thing in the pipeline that runs beside
# secrets, and sees only the two Zoom ones. workflow_call passes nothing that is
# not listed above, so that isolation is enforced by GitHub rather than by us
# remembering. Keep it that way when adding callers.

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Callers base64 the payload so that secret masking cannot corrupt
      # fragments of it on the way between jobs. Decode it here, at the point
      # of use, so the plain JSON never crosses a job boundary.
      - name: Decode payload
        id: payload
        env:
          ENCODED: ${{ inputs.payload }}
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "json<<${delimiter}"
            printf '%s' "$ENCODED" | base64 -d
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Zoom wants the token in a bare Authorization header, so it goes through
      # customHeaders - bearerToken would prefix it with "Bearer ".
      - name: Send Zoom webhook notification
        id: zoom
        continue-on-error: true
        uses: fjogeleit/http-request-action@f98bb26551cd1af7d3eb2674578a80754ece88db # v2.0.1
        with:
          url: '${{ secrets.ZOOM_WEBHOOK_URL }}?format=fields'
          method: POST
          contentType: application/json
          customHeaders: '{"Authorization": "${{ secrets.ZOOM_VERIFICATION_TOKEN }}"}'
          data: ${{ steps.payload.outputs.json }}
          timeout: '10000'
          retry: '2'
          retryWait: '2000'

      # A missed notification must never fail a submission, so the request runs
      # with continue-on-error and its failure is reported as an annotation.
      - name: Warn if the notification failed
        if: steps.zoom.outcome != 'success'
        run: |
          echo "::warning::Zoom webhook notification failed - see the previous step for the response."
